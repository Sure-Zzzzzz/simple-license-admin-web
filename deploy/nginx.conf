worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # 静态缓存策略（与总入口 LB 同标准）：入口 HTML 不缓存防陈旧 SPA；指纹资源 immutable
  map $uri $license_cache_control {
    default "no-store";
    ~*\.(js|css|woff2?|svg|png)$ "public, max-age=31536000, immutable";
  }

  # License 自有网络内反代单个后端容器；不把后端端口发布到宿主。
  upstream license_server {
    server license-server-a:8080;
  }

  server {
    listen 80;

    # License 管理端 SPA（乾坤子应用 entry 用目录形式，对齐可信应用接入手册；深链刷新回门户壳由上级 LB 处理）
    location ^~ /app/license/ {
      alias /www/license-admin/;
      try_files $uri $uri/ /app/license/index.html;
      add_header Cache-Control $license_cache_control;
    }

    # License 公开契约：浏览器携带 IAM PKCE 令牌（Bearer），Cookie 被前端主动省略
    location /api/license/v1/ {
      proxy_pass http://license_server;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 404;
    }
  }
}
